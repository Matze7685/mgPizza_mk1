<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza</title>
<style>
  *{box-sizing:border-box}
  :root{--red:#b3261e;--green:#2f6b3a;--cream:#fbf4e4}
  body{font-family:Georgia,"Times New Roman",serif;background:var(--cream);margin:0;color:#2b2118}
  main{max-width:560px;margin:0 auto;padding:0 0 40px}
  h1{margin:0;padding:28px 20px 6px;overflow-wrap:anywhere;background:var(--red);color:#fff;text-align:center;font-size:2.2em;letter-spacing:.04em;
     border-bottom:6px double #fff;box-shadow:0 4px 0 var(--green)}
  .date{background:var(--red);color:#ffe9d6;text-align:center;padding:0 20px 20px;margin:0;font-style:italic}
  .intro{margin:16px 16px 0;padding:12px 14px;background:#fff;border-left:6px solid var(--red);border-radius:6px;white-space:pre-line}
  .closed{margin:16px 16px 0;padding:12px 14px;background:#fff;border:1px solid var(--red);border-radius:6px;color:var(--red);font-weight:bold}
  .guestbtn:disabled{cursor:default;opacity:.85}
  main>label,main>select,main>.pizza,main>textarea,main>button,main>#msg{margin-left:16px;margin-right:16px;width:calc(100% - 32px)}
  main>label{display:block;margin-top:20px;font-weight:bold}
  select,input,textarea,button{font:inherit;padding:10px;border-radius:6px;border:1px solid #c9b79a;background:#fff;box-sizing:border-box;width:100%}
  .pizza{background:#fff;border:1px solid #e0d2b4;border-left:6px solid var(--green);border-radius:6px;padding:12px 14px;margin-top:12px;margin-bottom:0;box-shadow:2px 3px 0 #e8dcc2}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .name{font-weight:bold;font-size:1.25em;color:var(--red)} .info{color:#7a6a55;font-size:.92em;font-style:italic}
  .count{display:flex;align-items:center;gap:10px}
  .count button{width:38px;padding:4px;font-size:1.3em;background:var(--cream);border-color:var(--green);color:var(--green)}
  .count b{min-width:1.2em;text-align:center;font-size:1.2em}
  .toppings{margin-top:8px;font-size:.95em}.toppings label{display:block;padding:3px 0}
  button.send{background:var(--green);color:#fff;border:0;margin-top:18px;font-weight:bold;font-size:1.1em;padding:14px}
  #msg{margin-top:12px;font-weight:bold;color:var(--green)}
  .guests{margin:16px}
  .guestbtn{display:block;width:100%;margin-top:10px;padding:16px;background:#fff;border:1px solid #e0d2b4;border-left:6px solid var(--green);border-radius:6px;
     font-size:1.2em;font-weight:bold;color:var(--red);text-align:left;box-shadow:2px 3px 0 #e8dcc2;cursor:pointer}
  .guestbtn span{display:block;font-size:.8em;font-weight:normal;margin-top:4px}
  .guestbtn .ordered{color:var(--green)}
  .guestbtn .open{color:#7a6a55;font-style:italic}
  .hello{margin:16px 16px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .hello a{color:var(--green);text-decoration:underline;cursor:pointer;font-size:.95em}
  .sum{margin:12px 16px 0;padding:12px 14px;background:#fff;border:1px dashed var(--green);border-radius:6px}
  .sum b{color:var(--red)}
  textarea{margin-top:12px}
  .sline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
  button.del{width:auto;padding:4px 10px;font-size:.85em;background:#fff;border:1px solid var(--red);color:var(--red);border-radius:6px;cursor:pointer}
  button.delorder{margin-top:14px;background:transparent;border:1px solid var(--red);color:var(--red)}
  .sum.empty{color:#7a6a55;font-style:italic}
  .guestbtn .ordered span{font-size:1em;margin-top:6px}
  .guestbtn .ordered small{display:block;color:#7a6a55;font-size:.95em;margin-top:2px}
  .guestbtn .ordered em{font-style:normal;font-weight:bold}
  .guestbtn .ordered .minus{color:var(--red)}
  .ask{position:fixed;inset:0;background:rgba(43,33,24,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  .ask div{background:var(--cream);border-top:6px solid var(--red);border-radius:8px;padding:18px;max-width:380px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .ask p{margin:0 0 6px;font-weight:bold;font-size:1.1em}
  .ask small{display:block;color:#7a6a55;margin-bottom:14px}
  .ask .btns{display:flex;gap:10px;padding:0;box-shadow:none;border:0;background:none}
  .ask button{flex:1;cursor:pointer}
  .ask .yes{background:var(--red);color:#fff;border:0;font-weight:bold}
</style>
</head>
<body>
<main id="app">Lade …</main>
<script>
// === Einrichtung: Werte aus der Firebase-Konsole (siehe docs/README.md) ===
const PROJECT = "mgpizza-app";
const API_KEY = "AIzaSyCea9qvMqHYYgk8dAe5hGcDGMuobLgP6Tc";
// ==========================================================================

const base = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents`;
const eventId = new URLSearchParams(location.search).get("e");
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = n => n.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "gast";
const splitExtra = v => v.split(",").map(x => x.trim()).filter(Boolean);
// Angehakte Zusatzzutaten + frei eingetippte, ohne Doppelte
const mergeExtra = i => {
  const out = [...extraSel[i]];
  splitExtra(extras[i]).forEach(x => { if (!out.some(o => o.toLowerCase() === x.toLowerCase())) out.push(x); });
  return out;
};
// Gerätekennung: zufälliger Schlüssel, nur auf diesem Gerät. Auf dem Server liegt nur der Hash (ownerHash an der Bestellung);
// Ändern/Löschen prüfen die Firestore-Regeln (siehe docs/README.md). Kein Login, keine Mailadresse.
const rnd = () => [...crypto.getRandomValues(new Uint8Array(32))].map(b => b.toString(16).padStart(2, "0")).join("");
const sha256 = async t => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))].map(b => b.toString(16).padStart(2, "0")).join("");
let deviceKey = "";
try { deviceKey = localStorage.getItem("pizzaDeviceKey") || ""; if (!deviceKey) { deviceKey = rnd(); localStorage.setItem("pizzaDeviceKey", deviceKey); } }
catch (e) { deviceKey = deviceKey || rnd(); }   // ohne Speicher: gilt nur bis zum Schließen der Seite
let myHash = "", currentOwner = "";
const docRoot = `projects/${PROJECT}/databases/(default)/documents`;
const orderName = o => `${docRoot}/events/${eventId}/orders/${slug(o)}`;
const str = v => ({stringValue: v});
// Schreiben/Löschen als ein Schritt: Nachweis (nicht lesbar) + Bestellung
async function commit(writes) {
  return fetch(`https://firestore.googleapis.com/v1/${docRoot}:commit?key=${API_KEY}`, {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({writes})});
}
const proof = (name, nonce) => ({update: {name: `${docRoot}/events/${eventId}/proofs/${slug(name)}`, fields: {key: str(deviceKey), nonce: str(nonce)}}});
let event, guest = "", extras = [], extraSel = [], customExtra = "", counts = [], without = [], customCount = 0, customToppings = new Set(), pool = [], note = "", hadOrder = false;

async function load() {
  if (!eventId) { app.textContent = "Link unvollständig."; return; }
  const r = await fetch(`${base}/events/${encodeURIComponent(eventId)}?key=${API_KEY}`);
  if (!r.ok) { app.textContent = "Speisekarte nicht gefunden."; return; }
  myHash = await sha256(deviceKey);
  event = JSON.parse((await r.json()).fields.data.stringValue);
  document.title = event.title || "Pizza";
  // Alle Zutaten der Karte (einmal pro Name+Einheit) für die eigene Pizza
  const seen = new Set();
  pool = [];
  event.pizzas.forEach(p => p.toppings.forEach(t => {
    const k = t.name.toLowerCase() + "|" + t.unit;
    if (!seen.has(k)) { seen.add(k); pool.push(t); }
  }));
  // Zusatzzutaten, die zu einer Pizza dazugewählt werden können (alles aus der Karte, was nicht schon drauf ist)
  event.pizzas.forEach(p => {
    const own = new Set(p.toppings.map(t => t.name.toLowerCase()));
    const names = new Set();
    p.extraOptions = pool.filter(t => !own.has(t.name.toLowerCase()) && !names.has(t.name.toLowerCase()) && names.add(t.name.toLowerCase())).map(t => t.name);
  });
  showNames();
}

function header() {
  const date = new Date(event.date).toLocaleString("de-AT", {weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"});
  return `<h1>🍕 ${esc(event.title || "Pizza")}</h1><div class="date">${esc(date)}</div>`
    + (event.intro ? `<div class="intro">${esc(event.intro)}</div>` : "")
    + (event.closed ? `<div class="closed">Die Bestellung für diesen Abend ist geschlossen.</div>` : "");
}

// Sicherheitsfrage als eigener Dialog auf der Seite (das native confirm() wird in manchen App-Browsern unterdrückt)
function ask(question, detail, yesText) {
  return new Promise(resolve => {
    const box = document.createElement("div");
    box.className = "ask";
    box.innerHTML = `<div role="dialog" aria-modal="true"><p>${esc(question)}</p>${detail ? `<small>${esc(detail)}</small>` : ""}
      <div class="btns"><button class="no">Abbrechen</button><button class="yes">${esc(yesText)}</button></div></div>`;
    const done = v => { box.remove(); resolve(v); };
    box.querySelector(".no").onclick = () => done(false);
    box.querySelector(".yes").onclick = () => done(true);
    box.onclick = e => { if (e.target === box) done(false); };
    document.body.appendChild(box);
    box.querySelector(".no").focus();
  });
}

// Schritt 1: Namen wählen (mit bereits bestellten Pizzen)
// Pro Pizza: Extras und abgewählte Zutaten („Ohne“) getrennt, bei der eigenen Pizza die gewählten Zutaten
function lineHTML(l) {
  const parts = [];
  if (l.custom && l.custom.length) parts.push(`<em>Mit:</em> ${esc(l.custom.map(t => t.name).join(", "))}`);
  if (l.extra && l.extra.length) parts.push(`<em>Extra:</em> ${esc(l.extra.join(", "))}`);
  if (l.without && l.without.length) parts.push(`<em class="minus">Ohne:</em> ${esc(l.without.join(", "))}`);
  return `${l.count}× ${esc(l.name)}` + (parts.length ? `<small>${parts.join(" · ")}</small>` : "");
}
const orderHTML = o => o.lines.map(lineHTML).map(x => `<span>${x}</span>`).join("");

async function fetchOrders() {
  try {
    const r = await fetch(`${base}/events/${encodeURIComponent(eventId)}/orders?key=${API_KEY}&pageSize=300`);
    if (!r.ok) return {};
    const out = {};
    ((await r.json()).documents || []).forEach(d => {
      try { const o = JSON.parse(d.fields.data.stringValue); o.owner = (d.fields.ownerHash || {}).stringValue || ""; out[slug(o.guest)] = o; } catch (e) {}
    });
    return out;
  } catch (e) { return {}; }
}

async function showNames() {
  if (!event.guests.length) { app.innerHTML = header() + "<p style='margin:16px'>Der Gastgeber hat noch keine Gäste eingetragen.</p>"; return; }
  const draw = orders => {
    app.innerHTML = header() + `<label>${event.closed ? "Bestellungen" : "Wer bist du?"}</label><div class="guests">${event.guests.map((g, i) => {
      const o = orders && orders[slug(g)];
      const foreign = !!(o && o.owner && o.owner !== myHash);   // gehört zu einem anderen Gerät: nur ansehen
      const sub = orders === null ? "" : (o ? `<span class="ordered">✔ bestellt:${orderHTML(o)}</span>` : `<span class="open">noch nichts bestellt</span>`);
      const lock = foreign ? `<span class="open">🔒 Bestellung eines anderen Geräts – nur ansehen. Anderes Handy? Frag den Gastgeber.</span>` : "";
      return `<button class="guestbtn" data-g="${i}" ${event.closed || foreign ? "disabled" : ""}>${esc(g)}${sub}${lock}</button>`;
    }).join("")}</div>`;
    // Geschlossener Abend: Bestellungen nur anzeigen, nicht mehr ändern
    if (!event.closed) app.querySelectorAll(".guestbtn:not(:disabled)").forEach(b => b.onclick = () => pick(event.guests[+b.dataset.g]));
  };
  draw(null);                 // sofort anzeigen, Bestellungen danach nachladen
  draw(await fetchOrders());
}

// Schritt 2: Pizzen wählen (eine frühere Bestellung wird geladen und angezeigt)
async function pick(name) {
  guest = name;
  counts = event.pizzas.map(() => 0);
  without = event.pizzas.map(() => new Set());
  extras = event.pizzas.map(() => "");
  extraSel = event.pizzas.map(() => new Set());
  customCount = 0; customToppings = new Set(); customExtra = ""; note = ""; hadOrder = false; currentOwner = "";
  app.innerHTML = header() + "<p style='margin:16px'>Lade deine Bestellung …</p>";
  try {
    const r = await fetch(`${base}/events/${encodeURIComponent(eventId)}/orders/${slug(guest)}?key=${API_KEY}`);
    if (r.ok) {
      const doc = await r.json();
      currentOwner = (doc.fields.ownerHash || {}).stringValue || "";
      if (currentOwner && currentOwner !== myHash) { showNames(); return; }   // fremde Bestellung: nicht bearbeitbar
      const o = JSON.parse(doc.fields.data.stringValue);
      hadOrder = true; note = o.note || "";
      (o.lines || []).forEach(l => {
        if (l.custom || l.name === "Eigene Pizza") {
          customCount = l.count; customExtra = (l.extra || []).join(", ");
          (l.custom || []).forEach(t => { const k = pool.findIndex(x => x.name === t.name && x.unit === t.unit); if (k >= 0) customToppings.add(k); });
        } else {
          const i = event.pizzas.findIndex(p => p.name === l.name);
          if (i >= 0) { counts[i] = l.count; without[i] = new Set(l.without || []); 
            // Zusätze aus der Auswahlliste als Häkchen, alles andere ins freie Feld
            const free = [];
            (l.extra || []).forEach(x => { const o = event.pizzas[i].extraOptions.find(n => n.toLowerCase() === x.toLowerCase()); o ? extraSel[i].add(o) : free.push(x); });
            extras[i] = free.join(", "); }
        }
      });
    }
  } catch (e) {}
  render();
}

function summary() {
  const parts = event.pizzas.map((p, i) => counts[i] > 0 ? `<div class="sline"><span><b>${counts[i]}×</b> ${esc(p.name)}</span><button class="del" data-del="${i}" title="Entfernen">✕ entfernen</button></div>` : "").filter(Boolean);
  if (customCount > 0) parts.push(`<div class="sline"><span><b>${customCount}×</b> Eigene Pizza</span><button class="del" data-del="custom" title="Entfernen">✕ entfernen</button></div>`);
  return parts.length ? `<div class="sum">Deine Auswahl:${parts.join("")}</div>`
                      : `<div class="sum empty">Noch keine Pizza ausgewählt.</div>`;
}
const refreshSummary = () => {
  document.getElementById("sum").innerHTML = summary();
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => removeLine(b.dataset.del));
};

// Eine Pizza aus der Auswahl entfernen (Anzahl 0, abgewählte Zutaten und Zusätze zurücksetzen)
async function removeLine(i) {
  const name = i === "custom" ? "Eigene Pizza" : event.pizzas[+i].name;
  const n = i === "custom" ? customCount : counts[+i];
  if (!await ask(`${n}× ${name} aus der Bestellung von ${guest} entfernen?`, "Die Pizza wird aus der Auswahl genommen, samt abgewählter Zutaten und Extras.", "Entfernen")) return;
  if (i === "custom") { customCount = 0; customToppings = new Set(); customExtra = ""; }
  else { counts[+i] = 0; without[+i] = new Set(); extras[+i] = ""; extraSel[+i] = new Set(); }
  render();
}

// Die gespeicherte Bestellung des Gastes komplett löschen
async function deleteOrder() {
  if (!await ask(`Gesamte Bestellung von ${guest} löschen?`, `Achtung: Das ist die Bestellung von ${guest}. Das Löschen kann nicht rückgängig gemacht werden.`, "Ja, Bestellung löschen")) return;
  const r = await commit([proof(guest, rnd()), {delete: orderName(guest)}]);
  if (r.ok) showNames(); else document.getElementById("msg").textContent = r.status === 403
    ? "Das ist die Bestellung eines anderen Geräts – nur der Gastgeber kann sie löschen."
    : "Löschen hat nicht geklappt – bitte nochmal versuchen.";
}

function render() {
  app.innerHTML = header() + `
    <div class="hello"><div>Hallo <b>${esc(guest)}</b>!</div><a id="change">Name ändern</a></div>
    ${hadOrder ? "<div class='sum'>Du hast schon bestellt – deine Auswahl ist unten eingetragen. Du kannst sie ändern und erneut abschicken.</div>" : ""}
    <div id="sum">${summary()}</div>
    ${event.pizzas.map((p, i) => `<div class="pizza">
      <div class="row"><div><div class="name">${esc(p.name)}</div><div class="info">${esc(p.info || "")}</div></div>
        <div class="count"><button data-d="-1" data-i="${i}">−</button><b id="c${i}">${counts[i]}</b><button data-d="1" data-i="${i}">+</button></div></div>
      <div class="info" style="margin-top:6px">${esc(p.toppings.map(t => t.name).join(", "))}</div>
      <div class="toppings" id="t${i}" ${counts[i] ? "" : "hidden"}>Abwählen, was du nicht möchtest:${p.toppings.map(t => `<label><input type="checkbox" style="width:auto" ${without[i].has(t.name) ? "" : "checked"} data-i="${i}" data-t="${esc(t.name)}"> ${esc(t.name)}</label>`).join("")}
        ${p.extraOptions.length ? `<div style="margin-top:8px">Extra dazu:</div>${p.extraOptions.map(n => `<label><input type="checkbox" style="width:auto" ${extraSel[i].has(n) ? "checked" : ""} data-ei="${i}" data-e="${esc(n)}"> ${esc(n)}</label>`).join("")}` : ""}
        <input placeholder="Andere Zusatzzutat (optional, mehrere mit Komma)" data-x="${i}" value="${esc(extras[i])}" style="margin-top:8px"></div>
    </div>`).join("")}
    <div class="pizza">
      <div class="row"><div><div class="name">Eigene Pizza</div><div class="info">Zutaten selbst auswählen</div></div>
        <div class="count"><button data-d="-1" data-i="custom">−</button><b id="cc">${customCount}</b><button data-d="1" data-i="custom">+</button></div></div>
      <div class="toppings" id="tc" ${customCount ? "" : "hidden"}>${pool.map((t, k) => `<label><input type="checkbox" style="width:auto" ${customToppings.has(k) ? "checked" : ""} data-k="${k}"> ${esc(t.name)}</label>`).join("")}
        <input placeholder="Eigene Zutat dazu (mehrere mit Komma)" id="cx" value="${esc(customExtra)}" style="margin-top:8px"></div>
    </div>
    <textarea id="note" rows="2" placeholder="Anmerkung (optional)">${esc(note)}</textarea>
    <button class="send" id="send">Bestellung abschicken</button><div id="msg"></div>
    ${hadOrder ? `<button class='delorder' id='delorder'>Gesamte Bestellung von ${esc(guest)} löschen</button>` : ""}`;
  document.getElementById("change").onclick = showNames;
  app.querySelectorAll(".count button").forEach(b => b.onclick = () => {
    const d = +b.dataset.d;
    if (b.dataset.i === "custom") {
      customCount = Math.max(0, customCount + d);
      document.getElementById("cc").textContent = customCount;
      document.getElementById("tc").hidden = customCount === 0;
    } else {
      const i = +b.dataset.i; counts[i] = Math.max(0, counts[i] + d);
      document.getElementById("c" + i).textContent = counts[i];
      document.getElementById("t" + i).hidden = counts[i] === 0;
    }
    refreshSummary();
  });
  app.querySelectorAll("[data-t]").forEach(c => c.onchange = () => {
    const set = without[+c.dataset.i]; c.checked ? set.delete(c.dataset.t) : set.add(c.dataset.t);
  });
  app.querySelectorAll("[data-e]").forEach(c => c.onchange = () => {
    const set = extraSel[+c.dataset.ei]; c.checked ? set.add(c.dataset.e) : set.delete(c.dataset.e);
  });
  app.querySelectorAll("[data-k]").forEach(c => c.onchange = () => {
    c.checked ? customToppings.add(+c.dataset.k) : customToppings.delete(+c.dataset.k);
  });
  app.querySelectorAll("[data-x]").forEach(c => c.oninput = () => { extras[+c.dataset.x] = c.value; });
  document.getElementById("cx").oninput = e => { customExtra = e.target.value; };
  document.getElementById("note").oninput = e => { note = e.target.value; };
  document.getElementById("send").onclick = send;
  refreshSummary();
  const del = document.getElementById("delorder");
  if (del) del.onclick = deleteOrder;
}

async function send() {
  const msg = document.getElementById("msg");
  const lines = event.pizzas.map((p, i) => ({name: p.name, count: counts[i], without: [...without[i]], extra: mergeExtra(i)})).filter(l => l.count > 0);
  if (customCount > 0) {
    const chosen = [...customToppings].sort((a, b) => a - b).map(k => pool[k]);
    const cx = splitExtra(customExtra);
    if (!chosen.length && !cx.length) { msg.textContent = "Bitte Zutaten für die eigene Pizza wählen."; return; }
    lines.push({name: "Eigene Pizza", count: customCount, without: [], custom: chosen, extra: cx});
  }
  if (!lines.length) { msg.textContent = "Bitte mindestens eine Pizza wählen."; return; }
  const order = {guest, lines, note: note.trim()};
  // Bestellung gehört diesem Gerät (neu oder frei/alt: wird jetzt übernommen)
  const nonce = rnd();
  const r = await commit([proof(guest, nonce), {update: {name: orderName(guest), fields: {data: str(JSON.stringify(order)), ownerHash: str(myHash), nonce: str(nonce)}}}]);
  msg.textContent = r.ok ? "Danke! Bestellung gespeichert ✔ (du kannst sie jederzeit erneut abschicken)"
    : r.status === 403 ? "Diese Bestellung gehört einem anderen Gerät – nur der Gastgeber kann sie freigeben."
    : "Fehler beim Senden – bitte nochmal versuchen.";
  if (r.ok) setTimeout(showNames, 1500);
}
load().catch(() => app.textContent = "Fehler beim Laden.");
</script>
</body>
</html>
